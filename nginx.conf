# ==================================================
# 全局配置
# ==================================================
user  nginx;

# 自动匹配 CPU 核心数
worker_processes auto;

# 每个 worker 最大文件描述符（ulimit -n 保持一致）
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# ==================================================
# 事件模块
# ==================================================
events {
    # Linux 最高效的事件模型
    use epoll;

    # 单个 worker 最大并发连接数
    worker_connections 4096;

    # 一次性接受所有新连接，高并发场景开启
    multi_accept on;
}

# ==================================================
# HTTP 核心模块
# ==================================================
http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------
    # 日志
    # --------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    # 生产环境关闭 access_log 或写到独立文件，减少 IO
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------
    # 性能优化
    # --------------------------------------------------
    sendfile           on;
    tcp_nopush         on;    # sendfile 开启后配合使用，减少报文数
    tcp_nodelay        on;    # keepalive 连接下降低延迟

    keepalive_timeout  65;
    keepalive_requests 1000;  # 单个连接最大复用请求数

    # --------------------------------------------------
    # 请求限制
    # --------------------------------------------------
    client_max_body_size    20M;
    client_body_timeout     30s;
    client_header_timeout   30s;
    send_timeout            30s;

    # 隐藏版本号，防止版本探测攻击
    server_tokens off;

    # --------------------------------------------------
    # 安全响应头（全局）
    # --------------------------------------------------
    #防止 MIME 类型嗅探攻击
    add_header X-Content-Type-Options        "nosniff" always;
    #防止点击劫持 (Clickjacking)
    add_header X-Frame-Options               "DENY" always;
    #控制 Referer 信息泄露
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    #限制浏览器功能权限
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=()" always;
    #控制浏览器允许加载哪些资源，防御 XSS 和数据注入攻击
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src * data:; object-src 'none';" always;
    #强制 HTTPS 访问（HSTS），至少一年
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload" always;

    # --------------------------------------------------
    # 限流（防刷接口 / CC 攻击）
    # --------------------------------------------------
    # 定义限流区：10MB 内存可存约 16 万个 IP 状态
    #limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
    #limit_conn_zone $binary_remote_addr zone=perip:10m;

    # WebSocket 连接头映射（配合上面的 $connection_upgrade 变量）
    #map $http_upgrade $connection_upgrade {
    #    default upgrade;
    #    ''      close;
    #}
    ##
    # Virtual Host Configs
    ##

    include /etc/nginx/conf.d/*.conf;
}
