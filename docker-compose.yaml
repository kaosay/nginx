version: "3.8"
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    container_name: nginx
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS 配置；证书放在 nginx/ssl/（fullchain.pem + privkey.pem）
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    deploy:
      resources:
        limits:
          memory: 4g
    networks:
      - bridge
networks:
  bridge:
    external: true
